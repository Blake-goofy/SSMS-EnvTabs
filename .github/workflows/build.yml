# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Build

permissions:
  checks: write
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    outputs:
      version:
        description: VSIX version
        value: ${{ jobs.build.outputs.version }}
      asset_name:
        description: Versioned VSIX filename
        value: ${{ jobs.build.outputs.asset_name }}

env:
  Configuration: Release
  DeployExtension: False
  Solution: SSMS EnvTabs.sln
  TestProject: tests\SSMS.EnvTabs.Tests\SSMS.EnvTabs.Tests.csproj
  VsixManifestPath: SSMS EnvTabs\source.extension.vsixmanifest
  VsixOutputPath: SSMS EnvTabs\bin\Release\SSMS EnvTabs.vsix

jobs:
  build:
    name: Build
    runs-on: windows-latest
    outputs:
      version: ${{ steps.vsix_version.outputs.version-number }}
      asset_name: ${{ steps.vsix_version.outputs.asset-name }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln', '**/*.csproj', '**/packages.config', '**/packages.lock.json', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Read VSIX version
        id: vsix_version
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content "${{ env.VsixManifestPath }}"
          $namespace = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
          $namespace.AddNamespace("vsix", "http://schemas.microsoft.com/developer/vsx-schema/2011")
          $version = $manifest.SelectSingleNode("/vsix:PackageManifest/vsix:Metadata/vsix:Identity", $namespace).Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VSIX version: $version" }
          "version-number=$version" >> $env:GITHUB_OUTPUT
          "asset-name=SSMS_EnvTabs_$version.vsix" >> $env:GITHUB_OUTPUT

      - name: Restore NuGet packages
        run: msbuild "${{ env.Solution }}" /v:m -restore /t:Restore

      - name: Build
        run: msbuild "${{ env.Solution }}" /v:m /m /p:Configuration=${{ env.Configuration }} /p:DeployExtension=${{ env.DeployExtension }}

      - name: Run tests
        run: dotnet test "${{ env.TestProject }}" --configuration ${{ env.Configuration }} --no-build --no-restore --verbosity normal --logger:"trx;LogFileName=test-results.trx"

      - name: Check release workflows and packaged version
        shell: pwsh
        run: ./tests/CheckReleaseWorkflows.ps1

      - name: Report test results
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@v3
        with:
          name: Test Results
          path: "**/test-results.trx"
          reporter: dotnet-trx

      - name: Name VSIX asset
        shell: pwsh
        env:
          ASSET_NAME: ${{ steps.vsix_version.outputs.asset-name }}
        run: Copy-Item -LiteralPath "${{ env.VsixOutputPath }}" -Destination (Join-Path $env:RUNNER_TEMP $env:ASSET_NAME)

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.vsix_version.outputs.asset-name }}
          path: ${{ runner.temp }}/${{ steps.vsix_version.outputs.asset-name }}
          if-no-files-found: error
